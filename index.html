<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>اختبار Face ID</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f7f7f7;
      color: #222;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 35px 20px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 25px;
    }

    #status {
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

  </style>

</head>


<body>

<div class="box">

  <h1>نظام تسجيل الحضور</h1>

  <p id="status">
    جارٍ التحقق من موقعك...
  </p>

  <button id="faceButton"
          style="display:none"
          onclick="testFaceID()">
    🔐 التحقق باستخدام Face ID
  </button>

</div>


<script>


/* =========================
   إعدادات الموقع
========================= */

const OFFICE_LAT = 33.4938497;

const OFFICE_LNG = 36.2862717;

const ALLOWED_RADIUS = 100;


/* اسم المهندس من QR */

const engineer =
  new URLSearchParams(location.search)
    .get("engineer");


const status =
  document.getElementById("status");


const faceButton =
  document.getElementById("faceButton");


/* =========================
   التأكد من وجود QR
========================= */

if (!engineer) {

  status.innerHTML =
    "❌ رمز QR غير صحيح.";

} else {

  startLocationCheck();

}


/* =========================
   حساب المسافة
========================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* =========================
   فحص الموقع
========================= */

function startLocationCheck() {

  status.innerHTML =
    "📍 جارٍ تحديد موقعك...";


  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ جهازك لا يدعم تحديد الموقع.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const userLat =
        position.coords.latitude;

      const userLng =
        position.coords.longitude;


      const distance =
        distanceMeters(
          userLat,
          userLng,
          OFFICE_LAT,
          OFFICE_LNG
        );


      if (distance > ALLOWED_RADIUS) {

        status.innerHTML =
          "❌ أنت خارج موقع العمل.<br><br>" +
          "المسافة التقريبية: " +
          Math.round(distance) +
          " متر";

        return;

      }


      status.innerHTML =
        "📍 تم التحقق من موقعك بنجاح.<br>" +
        "المسافة: " +
        Math.round(distance) +
        " متر<br><br>" +
        "👤 المهندس: " +
        engineer +
        "<br><br>" +
        "اضغط الزر لتجربة Face ID.";


      faceButton.style.display =
        "inline-block";

    },


    function(error) {

      status.innerHTML =
        "❌ تعذر الوصول إلى موقعك.<br><br>" +
        "تأكد من السماح للموقع ثم أعد المحاولة.";

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================
   اختبار Face ID
========================= */

async function testFaceID() {

  try {

    if (
      !window.PublicKeyCredential
    ) {

      status.innerHTML =
        "❌ هذا المتصفح لا يدعم Passkey / Face ID.";

      return;

    }


    status.innerHTML =
      "🔐 جارٍ تشغيل Face ID...";


    faceButton.disabled = true;


    /*
     * Challenge تجريبي.
     * هذا الاختبار فقط للتأكد أن Face ID
     * يعمل من موقعنا.
     */

    const challenge =
      crypto.getRandomValues(
        new Uint8Array(32)
      );


    const userId =
      crypto.getRandomValues(
        new Uint8Array(16)
      );


    const credential =
      await navigator.credentials.create({

        publicKey: {

          challenge: challenge,

          rp: {
            name: "نظام تسجيل الحضور"
          },

          user: {

            id: userId,

            name: engineer,

            displayName: engineer

          },

          pubKeyCredParams: [

            {
              type: "public-key",
              alg: -7
            },

            {
              type: "public-key",
              alg: -257
            }

          ],

          authenticatorSelection: {

            authenticatorAttachment:
              "platform",

            residentKey:
              "required",

            userVerification:
              "required"

          },

          timeout: 60000,

          attestation:
            "none"

        }

      });


    if (credential) {

      status.innerHTML =
        "✅ تم التحقق بنجاح!<br><br>" +
        "Face ID / بصمة الجهاز تعمل بشكل صحيح على هذا الموقع.<br><br>" +
        "المهندس: " +
        engineer;

    }


  } catch (error) {

    console.error(error);


    status.innerHTML =
      "❌ لم ينجح اختبار Face ID.<br><br>" +
      "الخطأ: " +
      error.name;

    faceButton.disabled = false;

  }

}

</script>

</body>

</html>
